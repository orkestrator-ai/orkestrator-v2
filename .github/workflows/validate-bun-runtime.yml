name: Validate Bun runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-bun-runtime.yml"
      - "bridges/**"
      - "apps/backend/**"
      - "apps/desktop/**"
      - "docker/**"
      - "packages/**"
      - "patches/**"
      - ".dockerignore"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "package.json"
      - "turbo.json"
      - "scripts/download-bun.sh"
      - "scripts/install-packaged-app-linux.ts"
      - "scripts/verify-packaged-backend.ts"
  pull_request:
    paths:
      - ".github/workflows/validate-bun-runtime.yml"
      - "bridges/**"
      - "apps/backend/**"
      - "apps/desktop/**"
      - "docker/**"
      - "packages/**"
      - "patches/**"
      - ".dockerignore"
      - "bun.lock"
      - "bunfig.toml"
      - "mise.toml"
      - "package.json"
      - "turbo.json"
      - "scripts/download-bun.sh"
      - "scripts/install-packaged-app-linux.ts"
      - "scripts/verify-packaged-backend.ts"
  workflow_dispatch:

# Only pull request runs supersede each other. Pushes and manual runs need
# unique groups so a newer pending run cannot replace an older one.
concurrency:
  group: validate-bun-runtime-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundled-bun:
    name: Bundled Bun (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download and verify bundled Bun
        run: mise run download:bun

      - name: Build the desktop application
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: mise run build:all

      - name: Exercise the standalone packaged-backend layout
        run: cd apps/backend && bun test --preload ../../tests/setup-node.ts tests/standalone.test.ts

      # The app's `mac.identity` is "-", so electron-builder ad-hoc signs it,
      # opening every bundled file at once (over 20,000). That exceeds the macOS
      # runner's kernel descriptor cap (EMFILE), and a shell `ulimit` cannot go
      # above the cap, so raise the kernel limits first. electron-builder skips
      # signing for pull requests unless told otherwise, so only pushes to main
      # failed; signing pull requests too makes them prove the same thing. This
      # job has no signing identity or secrets, so any signature is ad hoc.
      - name: Build an unpacked Electron application
        shell: bash
        env:
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "Descriptor limits before: kern.maxfiles=$(sysctl -n kern.maxfiles) kern.maxfilesperproc=$(sysctl -n kern.maxfilesperproc) ulimit=$(ulimit -Sn)/$(ulimit -Hn)"
            sudo sysctl -w kern.maxfiles=262144 kern.maxfilesperproc=131072
            ulimit -Sn 131072
            echo "Descriptor limits after: ulimit=$(ulimit -Sn)/$(ulimit -Hn)"
          fi
          bunx electron-builder --dir --publish never

      - name: Install and validate the unpacked Linux application
        if: runner.os == 'Linux'
        env:
          HOME: ${{ runner.temp }}/orkestrator-linux-home
          XDG_DATA_HOME: ${{ runner.temp }}/orkestrator-linux-home/.local/share
        run: |
          mkdir -p "$HOME"
          bun scripts/install-packaged-app-linux.ts
          test -x "$XDG_DATA_HOME/orkestrator-v2/orkestrator-v2"
          test -L "$HOME/.local/bin/orkestrator-v2"
          test "$(readlink "$HOME/.local/bin/orkestrator-v2")" = "$XDG_DATA_HOME/orkestrator-v2/orkestrator-v2"
          if ! command -v desktop-file-validate >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y desktop-file-utils
          fi
          desktop-file-validate "$XDG_DATA_HOME/applications/orkestrator-v2.desktop"

      - name: Verify the packaged backend and native Sharp runtime
        run: mise run verify:packaged-backend

  container:
    name: Container (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # The same contract arguments as a release build, so the image build
      # checks its capability label against the installed contract scripts.
      - name: Compute image contract build arguments
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          capabilities="$(mise exec -- bun docker/image-manifest.ts capabilities --repo .)"
          echo "capabilities=${capabilities}" >> "$GITHUB_OUTPUT"

      - name: Build published architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: orkestrator-v2:ci-smoke-${{ matrix.name }}
          build-args: |
            ORKESTRATOR_IMAGE_CAPABILITIES=${{ steps.contract.outputs.capabilities }}
            ORKESTRATOR_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=orkestrator-container-validation-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=orkestrator-container-validation-${{ matrix.name }}

      # Run the image that was just built, natively on this architecture:
      # versions, bridge health, code-mode host and Chromium.
      - name: Smoke-test the final image
        run: bash docker/tests/final-image-smoke.sh orkestrator-v2:ci-smoke-${{ matrix.name }}
