name: Remote goal hold

# Runs `scripts/qa-remote-goal-hold.ts` (two backends of this checkout, no
# release): a worker on another node that is between goal iterations must not
# wake its coordinator until the goal ends. It starts real backends, so it is
# scheduled weekly and on demand, never per pull request. Moved here from the
# mixed-version qualification workflow, retired on 2026-11-14 (to-do 8108).
on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

# Scheduled and manual runs each keep their own result.
concurrency:
  group: remote-goal-hold-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  goal-hold:
    name: Remote goal hold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run the goal hold
        run: mise run qa:remote-goal-hold -- --report "$RUNNER_TEMP/remote-goal-hold-report.json"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-goal-hold-report
          path: ${{ runner.temp }}/remote-goal-hold-report.json
          if-no-files-found: ignore
          retention-days: 30
