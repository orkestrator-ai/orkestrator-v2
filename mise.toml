[tools]
bun = "1.4.4"

[tasks.dev]
description = "Start the Electron development application"
run = "bunx turbo --cwd . run dev --filter=@orkestrator/desktop"

[tasks."dev:test"]
description = "Start an isolated development test profile (foreground supervisor; stays attached)"
raw_args = true
run = "bun apps/desktop/scripts/dev-test.ts"

[tasks."dev:status"]
description = "Inspect an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-status.ts"

[tasks."dev:login"]
description = "Authenticate an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-login.ts"

[tasks."dev:stop"]
description = "Stop an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-stop.ts"

[tasks."dev:reset"]
description = "Reset an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-reset.ts"

[tasks."dev:prune"]
description = "Remove stopped development profiles whose checkout is gone (--older-than <days> for idle ones)"
raw_args = true
run = "bun apps/desktop/scripts/dev-prune.ts"

[tasks."dev:web"]
description = "Start the Vite frontend and standalone backend"
run = "bunx turbo run dev:web --cwd . --filter=@orkestrator/web --filter=@orkestrator/backend"

[tasks."dev:web-public"]
description = "Start the public web client"
run = "bunx turbo --cwd . run dev --filter=@orkestrator/web-public"

[tasks."dev:renderer"]
description = "Start only the Electron renderer"
run = "bunx turbo --cwd . run dev --filter=@orkestrator/web"

[tasks."dev:ios"]
description = "Build and launch the iOS simulator application"
raw_args = true
run = "bun scripts/run-ios-simulator.ts"

[tasks."start:web"]
description = "Build and start the standalone backend"
run = "bunx turbo run start:web --cwd . --filter=@orkestrator/backend"

[tasks."start:web-public"]
description = "Build and start the public-web backend"
run = "bunx turbo run start:web-public --cwd . --filter=@orkestrator/backend"

[tasks.build]
description = "Build the desktop application"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bunx turbo --cwd . run build --filter=@orkestrator/desktop"

[tasks."build:desktop"]
description = "Build the desktop application"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bunx turbo --cwd . run build --filter=@orkestrator/desktop"

[tasks."build:backend"]
description = "Build the standalone backend"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bunx turbo --cwd . run build --filter=@orkestrator/backend"

[tasks."build:cli"]
description = "Build the published CLI"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bunx turbo --cwd . run build --filter=orkestrator"

[tasks."build:renderer"]
description = "Build the Electron renderer"
run = "bunx turbo --cwd . run build --filter=@orkestrator/web"

[tasks."build:web-public"]
description = "Build the public web client"
run = "bunx turbo --cwd . run build --filter=@orkestrator/web-public"

[tasks."build:electron"]
description = "Build the Electron application"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bunx turbo --cwd . run build --filter=@orkestrator/desktop"

[tasks."build:claude-bridge"]
description = "Build the Claude bridge"
run = "bunx turbo --cwd . run build --filter=claude-bridge"

[tasks."build:codex-bridge"]
description = "Build the Codex bridge"
run = "bunx turbo --cwd . run build --filter=codex-bridge"

[tasks."build:acp-bridge"]
description = "Build the ACP bridge"
run = "bunx turbo --cwd . run build --filter=acp-bridge"

[tasks."build:pi-bridge"]
description = "Build the Pi bridge"
run = "bunx turbo --cwd . run build --filter=pi-bridge"

[tasks."build:cursor-bridge"]
description = "Build the Cursor bridge"
run = "bunx turbo --cwd . run build --filter=cursor-bridge"

[tasks."build:all"]
description = "Build every workspace package"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bunx turbo --cwd . run build"

# Test builds remove any inherited commit to keep one cache entry across commits.
# Their backend reports `null`, as `dev:test` does.
[tasks."build:cli:test"]
description = "Build the published CLI for tests, without a build commit"
run = "env -u ORKESTRATOR_BUILD_COMMIT bunx turbo --cwd . run build --filter=orkestrator"

[tasks."build:all:test"]
description = "Build every workspace package for tests, without a build commit"
run = "env -u ORKESTRATOR_BUILD_COMMIT bunx turbo --cwd . run build"

[tasks."download:bun"]
description = "Download the pinned Bun runtime for desktop packaging"
run = "./scripts/download-bun.sh"

[tasks."download:agent"]
description = "Download an agent CLI artifact"
raw_args = true
run = "bun scripts/download-agent.ts"

[tasks."download:claude"]
description = "Download the pinned Claude CLI"
run = "bun scripts/download-agent.ts claude"

[tasks."download:opencode"]
description = "Download the pinned OpenCode CLI (OpenCode 2.x, the toolchain's `opencode2`)"
run = "bun scripts/download-agent.ts opencode2"

[tasks."download:codex"]
description = "Download the pinned Codex CLI"
run = "bun scripts/download-agent.ts codex"

[tasks."download:grok"]
description = "Download the pinned Grok CLI"
run = "bun scripts/download-agent.ts grok"

[tasks."download:pi"]
description = "Download the pinned Pi CLI"
run = "bun scripts/download-agent.ts pi"

[tasks."toolchain:install"]
description = "Download and verify every pinned agent binary this data directory needs (same as `orkestrator toolchain install`)"
raw_args = true
run = "bun scripts/toolchain-install.ts"

[tasks."download:binaries"]
description = "Download the desktop-bundled runtime and agent binaries"
run = [
  "mise run download:bun",
  "mise run download:claude",
  "mise run download:opencode",
  "mise run download:codex",
]

[tasks."codex:protocol"]
description = "Regenerate the Codex app-server protocol"
run = "bun scripts/generate-codex-app-server-protocol.ts"

[tasks."codex:protocol:check"]
description = "Check the Codex app-server protocol for drift"
run = "bun scripts/generate-codex-app-server-protocol.ts --check"

[tasks."contract:manifest"]
description = "Regenerate the command contract manifest, lower the untyped-command baseline and store argument schemas (packages/protocol/contracts/)"
run = [
  "bun scripts/generate-contract-manifest.ts",
  "bun scripts/contract-check.ts --lower-baseline",
  "bun scripts/contract-ci-schemas.ts",
]

[tasks."contract:check"]
description = "Check the command contract manifest for drift and that untyped commands only shrink"
run = "bun scripts/contract-check.ts"

[tasks."contract:ci"]
description = "Check the support window: client adapters, removed commands, the compatibility register and stored argument schemas"
raw_args = true
run = "bun scripts/contract-ci.ts"

[tasks."contract:backfill"]
description = "Snapshot the contract of every published release that has none (packages/protocol/contracts/releases/)"
raw_args = true
run = "bun scripts/backfill-contract-snapshots.ts"

[tasks."contract:adapters"]
description = "Regenerate the domain client adapter list (packages/protocol/contracts/adapters.json)"
run = "bun scripts/generate-contract-adapters.ts"

[tasks."contract:adapters:check"]
description = "Check the domain client adapter list for drift from the domain client definitions"
run = "bun scripts/generate-contract-adapters.ts --check"

[tasks."qualify:mixed-versions"]
description = "Run this checkout against a published release (default: the support floor) in both node topologies, every domain scenario module (scheduled weekly in CI)"
raw_args = true
run = "bun scripts/qualify-contract-mixed-versions.ts"

[tasks."qa:remote-goal-hold"]
description = "Two backends of this checkout: a remote worker between goal iterations must not wake its coordinator until the goal ends (scheduled weekly in CI)"
raw_args = true
run = "bun scripts/qa-remote-goal-hold.ts"

[tasks.setup]
description = "Install dependencies and build every native bridge"
run = [
  "bun install",
  "mise run build:claude-bridge",
  "mise run build:codex-bridge",
  "mise run build:acp-bridge",
  "mise run build:pi-bridge",
  "mise run build:cursor-bridge",
]

[tasks."pack:cli"]
description = "Pack the CLI workspace"
run = "ORKESTRATOR_BUILD_COMMIT=\"$(bun scripts/build-commit.ts)\" bun pm pack --cwd packages/cli"

[tasks."smoke:cli"]
description = "Smoke-test the packed CLI"
run = "bun run --cwd packages/cli smoke:pack"

[tasks."publish:cli"]
description = "Smoke-test and publish the CLI under its update channel's npm dist-tag"
run = ["mise run smoke:cli", "bun scripts/publish-cli.ts"]

[tasks.preview]
description = "Preview the production renderer"
run = "bun run --cwd apps/web preview"

[tasks.test]
description = "Run the default non-iOS test suite (deterministic tests; excludes the slow tier)"
run = "bun scripts/test-all.ts"

[tasks."test:slow"]
description = "Run only the slow test tier: tests that wait on real processes, servers, or wall-clock time"
env = { ORKESTRATOR_TEST_TIER = "slow" }
run = "bun scripts/test-all.ts"

[tasks."test:full"]
description = "Run the complete non-iOS test suite, default and slow tiers"
env = { ORKESTRATOR_TEST_TIER = "all" }
run = "bun scripts/test-all.ts"

[tasks."test:changed"]
description = "Run tests affected by changes from main"
env = { ORKESTRATOR_TEST_AFFECTED = "1" }
run = "bun scripts/test-all.ts"

[tasks."test:all"]
description = "Run the complete test suite, including iOS"
env = { ORKESTRATOR_INCLUDE_IOS = "1", ORKESTRATOR_TEST_TIER = "all" }
run = "bun scripts/test-all.ts"

[tasks."test:logged"]
description = "Run a command with bounded persistent logs"
raw_args = true
run = "bun scripts/run-logged.ts"

[tasks."test:contention"]
description = "Run a command with busy-loop burners pinned to its CPU core, to reproduce load-only flakes ([--core N] [--burners K] [--duration S] -- <command>)"
raw_args = true
run = "bun scripts/test-under-contention.ts"

[tasks."flaky:recurrence"]
description = "Say whether a failure of a registered flake on a base is a real recurrence (<case-id> [--base <commit>] [--registry-ref <ref>]; read-only)"
raw_args = true
run = "bun scripts/flaky-tests/recurrence-check.ts"

[tasks."flaky:stale"]
description = "List open flake cases not observed for N days, with evidence for closing them ([--days N] [--group G]; read-only)"
raw_args = true
run = "bun scripts/flaky-tests/stale-report.ts"

[tasks."playwright:install"]
description = "Download the Chromium builds the pinned Playwright needs; a no-op when they are already installed"
# A new host, or a Playwright upgrade, otherwise fails every browser test with
# "Executable doesn't exist". --no-remove keeps builds that worktrees on another
# Playwright version still use; the shared cache is locked during a download.
run = "bunx playwright install --no-remove --no-progress chromium"

[tasks."test:browser"]
description = "Run the component and public-site browser suites"
depends = ["playwright:install"]
# An inherited NODE_ENV=production (an agent session the packaged app started)
# serves React's production build, which the fixtures' retry paths fail under.
env = { NODE_ENV = false }
# Both suites need only loopback, so on Linux they run in a private network
# namespace where other builds' Docker networks cannot abort Chromium's requests
# (flake 2340). ORKESTRATOR_E2E_HOST_NETWORK=1 keeps them on the host network.
run = "bun check -p e2e/tsconfig.json && bun scripts/loopback-network.ts -- bunx playwright test --config e2e/playwright.config.ts && bun scripts/loopback-network.ts -- bunx playwright test --config e2e/public-site/playwright.config.ts"

[tasks."test:agent:browser"]
description = "Run browser agent tests against an already-running profile (use test:agent:browser:isolated for one-shot validation)"
depends = ["build:cli:test", "playwright:install"]
run = "bunx playwright test --config e2e/agent-testing/playwright.browser.config.ts"

[tasks."test:agent:browser:isolated"]
description = "Start a disposable profile, run all browser agent tests, then stop/reset it"
raw_args = true
depends = ["build:cli:test", "playwright:install"]
run = "bun apps/desktop/scripts/test-agent-browser-isolated.ts"

[tasks."test:agent:design:isolated"]
description = "One-shot real-stack design-canvas validation with disposable profile cleanup"
raw_args = true
depends = ["playwright:install"]
run = "bun apps/desktop/scripts/test-agent-browser-isolated.ts --design"

[tasks."test:cli:scenarios"]
description = "Run targeted CLI scenarios against isolated packaged backends (credential-free unless --provider)"
raw_args = true
depends = ["build:cli:test"]
run = "bun packages/cli/scripts/run-scenarios.ts"

[tasks."test:agent:docker:isolated"]
description = "Build the image, then smoke and qualify it while the Docker fixture profiles start, run the fixture shards side by side, and reset the disposable profiles"
depends = ["playwright:install"]
run = "bun apps/desktop/scripts/test-agent-browser-isolated.ts --docker --no-agent-credentials --agent-platforms codex,grok,opencode,cursor,pi"

[tasks."test:agent:docker"]
description = "Run the Docker agent browser fixture"
depends = ["playwright:install"]
env = { ORKESTRATOR_AGENT_TEST_DOCKER = "1" }
run = "bunx playwright test --config e2e/agent-testing/playwright.browser.config.ts --grep 'Docker fixture'"

[tasks."test:preview:docker"]
description = "Opt-in service preview checks on real Docker: same-port containers, host decoy, recreation, docker exec relay (needs ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE)"
run = """
: "${ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE:?Set ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE to the image under test}"
export ORKESTRATOR_TEST_DOCKER_RELAY_IMAGE="${ORKESTRATOR_TEST_DOCKER_RELAY_IMAGE:-$ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE}"
bun test --cwd apps/backend ./src/core/preview-docker.test.ts ./src/preview-relay-supervisor.test.ts --parallel=1
"""

[tasks."test:preview:browser"]
description = "Opt-in Chromium, Firefox and WebKit private-origin checks (set ORKESTRATOR_TEST_PREVIEW_VITE_DIR for HMR, ORKESTRATOR_TEST_PREVIEW_NEXT_DIR for the Next.js fixture)"
raw_args = true
run = "bunx playwright test --config e2e/preview/playwright.preview.config.ts"

[tasks."test:preview:webkit-libs"]
description = "Prepare a private PLAYWRIGHT_BROWSERS_PATH whose WebKit has the Ubuntu 24.04 libraries an unsupported Linux host lacks"
raw_args = true
run = "bun scripts/playwright-webkit-host-libs.ts"

[tasks."test:preview:bench"]
description = "Opt-in loopback latency of the preview routes, and a loopback self-test of the two-machine baseline tool"
# The bounded test console drops console.log unless asked; the numbers are the output.
env = { ORKESTRATOR_PREVIEW_BENCH = "1", ORKESTRATOR_TEST_VERBOSE_CONSOLE = "1" }
run = "bun test --cwd apps/backend ./src/preview-bench.test.ts ./src/preview-latency-baseline.test.ts --parallel=1"

[tasks."test:agent:paused-interactions"]
description = "Opt-in billed provider qualification past ten minutes against an already-running disposable profile"
run = "bunx playwright test --config e2e/agent-testing/playwright.paused-interactions.config.ts"

[tasks."test:agent:coordinator"]
description = "Opt-in live coordinator suite: a disposable profile and real provider turn per platform (--credential-source <platform> narrows)"
raw_args = true
run = "bun apps/desktop/scripts/test-agent-coordinator-live.ts"

[tasks."test:agent:goals"]
description = "Opt-in live goal suite: a disposable profile and real provider turns per platform (--credential-source <platform> narrows)"
raw_args = true
run = "bun apps/desktop/scripts/test-agent-goals-live.ts"

[tasks."test:agent:auto-pipeline"]
description = "Auto-pipeline launch flow end to end on a disposable Pi-only profile with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-auto-pipeline.ts"

[tasks."test:agent:coordinator:routing-fake"]
description = "Coordinator routing build case (a cancelled build is not restarted) on a disposable Pi-only profile with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-routing-fake.ts"

[tasks."test:agent:coordinator:surfaces-fake"]
description = "Coordinator worker surfaces (root-changes approval to local and container workers, a container worker's browser preview) on a disposable Pi-only profile with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-surfaces-fake.ts"

[tasks."test:agent:coordinator:node-mail-fake"]
description = "Coordinator-to-coordinator node mail (round trip, loop bound, main replacement) between two disposable Pi-only profiles, one the other's leaf, with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-node-mail-fake.ts"

[tasks."test:agent:coordinator:restart-fake"]
description = "Coordinator restarts a build pipeline step a usage limit stopped, on this node and on a leaf, between two disposable Pi-only profiles with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-restart-fake.ts"

[tasks."test:agent:suborks"]
description = "/subork qualification (every scripted provider as caller and target, and a call across a killed backend) on a disposable Pi and OpenCode profile with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-suborks.ts"

[tasks."test:agent:coordinator:notice-live"]
description = "Coordinator usage-limit notices (grouped stops from a leaf, a move off the limited login, a stop queued across restarts) between two disposable Claude and Pi profiles on fixture accounts and a loopback provider (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-notice-live.ts"

[tasks."test:agent:coordinator:gap-tools-fake"]
description = "Coordinator gap tools (worker changes, fork, stop, slash command, schedule edits, PR and question refusals) on this node and through a leaf node, on two disposable Pi-only profiles with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-gap-tools-fake.ts"

[tasks."test:agent:coordinator-slow-remote"]
description = "Coordinator typed message and mail fast-forward with a slow local remote, on a disposable Pi-only profile with a loopback fake model (no credentials, nothing billed)"
run = "bun apps/desktop/scripts/test-agent-coordinator-slow-remote.ts"

[tasks."test:agent:electron"]
description = "Run agent tests in Electron"
run = "bunx playwright test --config e2e/agent-testing/playwright.electron.config.ts"

[tasks."test:agent:electron:packaged"]
description = "Run shipping package security smoke (macOS/Linux) and Linux packaged design journey; build shipping and packaged-test binaries first"
run = "bunx playwright test --config e2e/agent-testing/playwright.packaged-electron.config.ts"

[tasks."test:ios"]
description = "Run the iOS unit tests"
run = "bun scripts/test-ios.ts"

[tasks."test:unit"]
description = "Run the root unit tests"
run = "bun test tests/unit"

[tasks.improvement]
description = "Run self-improvement now and wait for it (experimental; turn it on in Settings → Experimental; docs/architecture/self-improvement.md)"
run = "orkestrator self-improvement run --wait"

[tasks."improvement:preview"]
description = "Show what a self-improvement run would file, without filing it or calling a model"
run = "orkestrator self-improvement run --dry-run --wait"

[tasks."improvement:status"]
description = "Show self-improvement's settings, last run, tracked tickets and themes"
run = "orkestrator self-improvement status"

[tasks."efficiency:baseline"]
description = "Run the efficiency counters harness (docs/development/efficiency-harness.md)"
raw_args = true
run = "bun scripts/efficiency/run.ts"

[tasks.typecheck]
description = "Typecheck every workspace package, the root and e2e tests, and repository scripts"
run = [
  "bunx turbo --cwd . run typecheck",
  "bun check -p tests/tsconfig.json",
  "bun check -p e2e/tsconfig.json",
  "bun check -p e2e/agent-testing/tsconfig.json",
]

[tasks."disk:report"]
description = "Report disk used by Orkestrator work, what is orphaned, and who cleans it (read-only)"
raw_args = true
run = "bun scripts/disk-report.ts"

[tasks.format]
description = "Format the repository"
run = "bun fmt ."

[tasks."format:check"]
description = "Check repository formatting"
run = "bun fmt --check ."

[tasks.lint]
description = "Lint the repository"
run = "bunx oxlint ."

[tasks."lint:fix"]
description = "Fix auto-fixable lint findings"
run = "bunx oxlint --fix ."

[tasks.guards]
description = "Run the repository-wide guards (source guards, DOM absence, inheritance, test ownership, raw console, doc registers) in one fast process"
raw_args = true
run = "bun scripts/guards.ts"

[tasks.check]
description = "Check formatting, lint, guards, and types"
run = ["mise run format:check", "mise run lint", "mise run guards", "mise run typecheck"]

[tasks."verify:opencode2:live"]
description = "Run the OpenCode 2.x live set against the pinned 2.x binary (OPENCODE2_CLI_PATH; isolated HOME, scripted local model, no credentials)"
env = { RUN_LIVE_OPENCODE2 = "1" }
run = [
  'test -x "${OPENCODE2_CLI_PATH:-}" || { echo "verify:opencode2:live: set OPENCODE2_CLI_PATH to the pinned 2.x binary" >&2; exit 2; }',
  "bun test --cwd apps/backend src/core/opencode2/opencode2- --parallel=1",
]

[tasks."verify:opencode2:real-stack"]
description = "Run the idle-observation spec's OpenCode cases, steer included, with scripted models against a running dev:test profile (ORKESTRATOR_AGENT_TEST_PROFILE)"
depends = ["build:cli:test", "playwright:install"]
env = { ORKESTRATOR_AGENT_TEST_LIVE_IDLE_OBSERVATION = "1", ORKESTRATOR_AGENT_TEST_IDLE_FAKE_MODELS = "1", ORKESTRATOR_AGENT_TEST_IDLE_PLATFORMS = "opencode" }
run = [
  'test -n "${ORKESTRATOR_AGENT_TEST_PROFILE:-}" || { echo "verify:opencode2:real-stack: set ORKESTRATOR_AGENT_TEST_PROFILE to a running dev:test profile" >&2; exit 2; }',
  'ORKESTRATOR_AGENT_TEST_IDLE_CASES="${ORKESTRATOR_AGENT_TEST_IDLE_CASES:-missed-final,approval,reconnect,hidden,no-renderer,steer}" bunx playwright test --config e2e/agent-testing/playwright.browser.config.ts e2e/agent-testing/idle-observation-live.spec.ts',
]

[tasks."verify:opencode2:container"]
description = "Run the idle-observation spec's OpenCode cases in a container environment, preserving rebuild included, with a scripted model on the container's loopback, against a running dev:test profile (ORKESTRATOR_AGENT_TEST_PROFILE)"
depends = ["build:cli:test", "playwright:install"]
env = { ORKESTRATOR_AGENT_TEST_LIVE_IDLE_OBSERVATION = "1", ORKESTRATOR_AGENT_TEST_IDLE_FAKE_MODELS = "1", ORKESTRATOR_AGENT_TEST_IDLE_PLATFORMS = "opencode", ORKESTRATOR_AGENT_TEST_IDLE_ENVIRONMENT = "container" }
run = [
  'test -n "${ORKESTRATOR_AGENT_TEST_PROFILE:-}" || { echo "verify:opencode2:container: set ORKESTRATOR_AGENT_TEST_PROFILE to a running dev:test profile" >&2; exit 2; }',
  'ORKESTRATOR_AGENT_TEST_IDLE_CASES="${ORKESTRATOR_AGENT_TEST_IDLE_CASES:-missed-final,approval,reconnect,hidden,no-renderer,steer,rebuild}" bunx playwright test --config e2e/agent-testing/playwright.browser.config.ts e2e/agent-testing/idle-observation-live.spec.ts',
]

[tasks."verify:accounts:resend-live"]
description = "Prove automatic switching's resend across a real bridge replacement (real bridges and pinned CLIs, scripted provider, no billed turn)"
run = "bun test --cwd apps/backend ./tests/account-switch-resend-live.test.ts --preload ../../tests/setup-node.ts --parallel=1"

[tasks."verify:claude:mcp-live"]
description = "Prove Claude MCP removal and rename on a running CLI (real CLI, no credentials)"
run = "bun test --cwd bridges/claude-bridge ./src/services/session-manager-prompt-mcp-sync.live.test.ts --preload ../../tests/setup-node.ts --parallel=1"

[tasks."verify:claude:first-turn-live"]
description = "Prove what a parked Claude spare does and refuses, on the pinned CLI (real CLI, no credentials, no model)"
run = "bun test --cwd bridges/claude-bridge ./src/services/claude-first-turn.live.test.ts --preload ../../tests/setup-node.ts --parallel=1"

[tasks."verify:claude:sandbox-live"]
description = "Prove the pinned Claude CLI enforces the provider sandbox the bridge sets: no write outside the workspace, no unlisted host, no card (macOS, or Linux whose bubblewrap can nest the CLI's namespace; real CLI, no credentials, scripted model)"
run = "bun test --cwd bridges/claude-bridge ./src/services/claude-provider-sandbox.live.test.ts --preload ../../tests/setup-node.ts --parallel=1"

[tasks."measure:claude:first-turn"]
description = "Time a first Claude turn cold, on a spare and warm (real CLI, no credentials, no model)"
run = "bun bridges/claude-bridge/src/services/claude-first-turn.live-probe.ts 5"

[tasks."verify:claude:plugin-mcp-live"]
description = "Prove the MCP editor's Claude plugin rows match the pinned CLI (real CLI, no credentials)"
env = { RUN_LIVE_CLAUDE_PLUGIN_MCP = "1" }
run = "bun test --cwd apps/backend ./tests/claude-plugin-mcp-live.test.ts --preload ../../tests/setup-node.ts --parallel=1"

[tasks."verify:codex:mcp-live"]
description = "Prove the MCP editor's Codex trust and merge rules match the pinned binary (real binary, no credentials)"
env = { RUN_LIVE_CODEX_MCP = "1" }
run = "bun test --cwd apps/backend ./tests/codex-mcp-parity-live.test.ts --parallel=1"

[tasks."verify:codex:network-approval"]
description = "Prove a managed-network approval saves no rule, and where an accepted amendment is stored, on the pinned Codex (disposable container, no credentials)"
run = "bash scripts/verify-codex-network-approval.sh"

[tasks."verify:grok:mcp-live"]
description = "Prove the MCP editor's Grok trust, source and precedence rules match the pinned binary (real binary, no credentials)"
env = { RUN_LIVE_GROK_MCP = "1" }
run = "bun test --cwd apps/backend ./tests/grok-mcp-parity-live.test.ts --parallel=1"

[tasks."verify:toolchains:live"]
description = "Verify live toolchain artifacts"
env = { RUN_LIVE_TOOLCHAIN_ARTIFACTS = "1" }
run = "bun scripts/verify-toolchain-artifacts.ts"

[tasks."verify:packaged-backend"]
description = "Verify the packaged backend runtime"
run = "bun scripts/verify-packaged-backend.ts"

[tasks."verify:codex:protocol"]
description = "Strictly verify the Codex app-server protocol"
env = { CODEX_PROTOCOL_CHECK_ALLOW_MISSING_BINARY = "0" }
run = "bun scripts/generate-codex-app-server-protocol.ts --check"

[tasks."docker:check-base"]
description = "Check whether the pinned Docker base image digest is still current"
run = "bun scripts/check-base-image-digest.ts"

[tasks."docker:build"]
description = "Build the production Docker image"
run = "docker build $(bun scripts/docker-image-build-args.ts) -t orkestrator-v2:latest -f docker/Dockerfile ."

[tasks."docker:build:dev"]
description = "Build the development Docker image"
raw_args = true
run = "bun apps/desktop/scripts/dev-build-image.ts"

[tasks."docker:disposable"]
description = "Start, restart or stop a disposable rootless Docker daemon for the live container suites"
raw_args = true
run = "bun scripts/disposable-docker-daemon.ts"

[tasks."package:mac"]
description = "Build and install an unpacked macOS application"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all",
  "bunx electron-builder --mac --dir",
  "bun scripts/install-packaged-app-mac.ts",
]

[tasks."package:linux"]
description = "Build and install an unpacked Linux application"
run = ["mise run package:linux:unpacked", "bun scripts/install-packaged-app-linux.ts"]

[tasks."package:linux:unpacked"]
description = "Build the unpacked Linux application under release/ without installing it"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all",
  "bunx electron-builder --linux --dir",
]

[tasks."package:linux:unpacked:test"]
description = "Build the unpacked Linux application for the packaged Electron spec (inspect fuse on) under release/packaged-test without installing it"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all:test",
  "bunx electron-builder --linux --dir --config electron-builder.packaged-test.config.ts --publish never",
]

[tasks."package:mac:unpacked:test"]
description = "Build the unpacked macOS application for the packaged Electron specs (inspect fuse on, ad-hoc identity) under release/packaged-test without installing it"
env = { CSC_IDENTITY_AUTO_DISCOVERY = "false" }
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all:test",
  "bunx electron-builder --mac --dir --config electron-builder.packaged-test.config.ts --publish never",
]

[tasks."test:package:security"]
description = "Build this host's unsigned shipping --dir package (macOS ad-hoc or Linux), read its fuses and run the shipping security smoke. Never signs with a Developer ID, notarizes, installs or publishes"
env = { CSC_IDENTITY_AUTO_DISCOVERY = "false" }
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all:test",
  "bunx electron-builder --$(if [ \"$(uname -s)\" = Darwin ]; then echo mac; else echo linux; fi) --dir --publish never",
  "bun scripts/verify-packaged-security.ts",
  "bunx playwright test --config e2e/agent-testing/playwright.packaged-electron.config.ts packaged-security-electron.spec.ts",
]

[tasks."package:release"]
description = "Build, sign, notarize, and install a macOS release"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all",
  "bunx electron-builder --mac --config electron-builder.release.config.ts --publish never",
  "bun scripts/install-packaged-app-mac.ts",
]

[tasks."release:version"]
description = "Set the Orkestrator version in every manifest and regenerate the lockfiles"
raw_args = true
run = "bun scripts/set-version.ts"

[tasks."release:desktop"]
description = "Build this platform's desktop release and upload it to the draft GitHub release"
raw_args = true
run = "bun scripts/release-desktop.ts build"

[tasks."release:linux"]
description = "Run the Linux release build on the Linux builder over SSH (check | build [--no-publish] | attach)"
raw_args = true
run = "bun scripts/release-linux-remote.ts"

[tasks."release:publish"]
description = "Publish the draft GitHub release once macOS and Linux are both uploaded"
run = "bun scripts/release-desktop.ts publish"

[tasks."release:pin-installer"]
description = "Pin the site's install.sh to a published Stable release"
raw_args = true
run = "bun scripts/pin-install-script.ts"

