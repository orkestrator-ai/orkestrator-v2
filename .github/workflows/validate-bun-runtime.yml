name: Validate Bun runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-bun-runtime.yml"
      - "bridges/**"
      - "apps/backend/**"
      - "apps/desktop/**"
      - "docker/**"
      - "packages/protocol/**"
      - "bun.lock"
      - "mise.toml"
      - "package.json"
      - "scripts/download-bun.sh"
      - "scripts/install-packaged-app-linux.ts"
      - "scripts/verify-packaged-backend.ts"
  pull_request:
    paths:
      - ".github/workflows/validate-bun-runtime.yml"
      - "bridges/**"
      - "apps/backend/**"
      - "apps/desktop/**"
      - "docker/**"
      - "packages/protocol/**"
      - "bun.lock"
      - "mise.toml"
      - "package.json"
      - "scripts/download-bun.sh"
      - "scripts/install-packaged-app-linux.ts"
      - "scripts/verify-packaged-backend.ts"
  workflow_dispatch:

concurrency:
  group: validate-bun-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundled-bun:
    name: Bundled Bun (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download and verify bundled Bun
        run: mise run download:bun

      - name: Build the desktop application
        run: mise run build:all

      - name: Exercise the standalone packaged-backend layout
        run: cd apps/backend && bun test --preload ../../tests/setup-node.ts tests/standalone.test.ts

      - name: Build an unpacked Electron application
        run: bunx electron-builder --dir

      - name: Install and validate the unpacked Linux application
        if: runner.os == 'Linux'
        env:
          HOME: ${{ runner.temp }}/orkestrator-linux-home
          XDG_DATA_HOME: ${{ runner.temp }}/orkestrator-linux-home/.local/share
        run: |
          mkdir -p "$HOME"
          bun scripts/install-packaged-app-linux.ts
          test -x "$XDG_DATA_HOME/orkestrator-v2/orkestrator-v2"
          test -L "$HOME/.local/bin/orkestrator-v2"
          test "$(readlink "$HOME/.local/bin/orkestrator-v2")" = "$XDG_DATA_HOME/orkestrator-v2/orkestrator-v2"
          if ! command -v desktop-file-validate >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y desktop-file-utils
          fi
          desktop-file-validate "$XDG_DATA_HOME/applications/orkestrator-v2.desktop"

      - name: Verify the packaged backend and native Sharp runtime
        run: mise run verify:packaged-backend

  container:
    name: Container (linux/amd64 + linux/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build both published architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=orkestrator-container-validation
          cache-to: type=gha,mode=max,scope=orkestrator-container-validation
