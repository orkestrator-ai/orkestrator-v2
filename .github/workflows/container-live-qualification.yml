name: Container live qualification

# The opt-in live Docker suites (docs/development/container-qualification.md)
# against a real Linux Engine on both published architectures. A fake
# `docker` cannot prove filesystem retention, packet rules, mount
# permissions, name conflicts or signal delivery, so these run weekly, on
# demand, and on pull requests that change the suites or this workflow.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/container-live-qualification.yml"
      - "apps/backend/tests/container-live-*.test.ts"
      - "apps/backend/tests/container-benchmarks.test.ts"
      - "apps/backend/tests/build-pipeline-code-rewind-docker.test.ts"
      - "apps/backend/tests/container-lifecycle-fixtures.ts"
      - "apps/backend/tests/container-live-rebuild-*.ts"
      - "apps/backend/tests/container-live-workspace.ts"
      - "apps/backend/tests/container-live-cleanup.ts"
      - "apps/backend/tests/container-xattr-fixture.js"
      - "apps/backend/tests/claude-state-signal-docker.test.ts"
      - "apps/backend/tests/claude-terminal-failed-turn-docker.test.ts"
      - "apps/backend/tests/tmux-hook-signal-docker.test.ts"
      - "apps/backend/tests/container-worktree-signal-docker.test.ts"
      - "apps/backend/tests/container-start-docker.test.ts"
      - "apps/backend/tests/project-git-mirror-docker.test.ts"
      - "apps/backend/tests/bridge-credential-docker.test.ts"
      - "apps/backend/src/core/container-bridge-credential.ts"
      - "packages/protocol/src/node/bridge-credential.ts"
      - "apps/backend/tests/staged-input-relay-docker.test.ts"
      - "apps/backend/tests/portable-inputs-stamps-docker.test.ts"
      - "apps/backend/tests/claude-config-filter-docker.test.ts"
      - "apps/backend/src/core/claude-container-config.ts"
      - "apps/backend/src/core/container-start.ts"
      - "apps/backend/src/core/design/export-container.test.ts"
      - "apps/backend/src/core/design/export-writer.ts"
      - "apps/backend/src/core/design/exports.ts"
      - "apps/backend/scripts/container-exec-cost.ts"
      - "docker/orkestrator-state-signal.sh"
      - "docker/orkestrator-worktree-signal.sh"
      - "docker/orkestrator-migrate.sh"
      - "docker/entrypoint.sh"
      - "docker/init-firewall.sh"
      - "docker/firewall-domains.sh"
      - "docker/update-firewall.sh"
      - "docker/orkestrator-egress-gateway.sh"
      - "docker/orkestrator-egress-filter.pl"
      - "apps/backend/src/core/egress-gateway.ts"
      - "apps/backend/src/core/github-ranges-cache.ts"
      - "apps/backend/scripts/github-ranges-seed.ts"
      - "scripts/qualify-opencode-seeded-data.sh"
      - "scripts/opencode-seeded-data/**"

# Only pull request runs supersede each other. Scheduled and manual runs need
# unique groups so a newer pending run cannot replace an older one.
concurrency:
  group: container-live-qualification-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Live suites (${{ matrix.name }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    env:
      RUN_LIVE_DOCKER_TESTS: "1"
      ORKESTRATOR_QUALIFICATION_IMAGE: orkestrator-v2:qualification-${{ matrix.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute image contract build arguments
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          capabilities="$(bun docker/image-manifest.ts capabilities --repo .)"
          echo "capabilities=${capabilities}" >> "$GITHUB_OUTPUT"

      # The image must carry a manifest, and is never the `latest` tag.
      - name: Build the qualification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.ORKESTRATOR_QUALIFICATION_IMAGE }}
          build-args: |
            ORKESTRATOR_IMAGE_CAPABILITIES=${{ steps.contract.outputs.capabilities }}
            ORKESTRATOR_SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=orkestrator-container-validation-${{ matrix.name }}

      - name: Record the daemon
        run: docker info --format '{{.ServerVersion}} {{.OperatingSystem}} {{.Architecture}} cgroup={{.CgroupVersion}} {{.SecurityOptions}}'

      # Restricted firewalls fail closed without GitHub's ranges, and every
      # suite's fresh data directory would ask api.github.com/meta
      # unauthenticated; a hosted runner's shared address has often spent that
      # quota (60 an hour), which failed the firewall suites with `not-ready`.
      # Fetch the ranges once with the job token for every suite
      # (`seedLiveGithubRanges`). Best effort: without a seed the suites fetch.
      - name: Seed GitHub's address ranges
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          seed="${RUNNER_TEMP}/github-ranges.txt"
          if gh api meta > "${RUNNER_TEMP}/github-meta.json" &&
            bun apps/backend/scripts/github-ranges-seed.ts "${RUNNER_TEMP}/github-meta.json" "$seed"; then
            echo "ORKESTRATOR_LIVE_GITHUB_RANGES_SEED=${seed}" >> "$GITHUB_ENV"
          else
            echo "::warning::GitHub's ranges could not be seeded; the live suites fetch them themselves."
          fi

      # One step per suite so each result maps to one check; every step runs
      # even when an earlier one fails.
      - name: Live lifecycle (C09, C11, C12, C20)
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-qualification.test.ts --parallel=1

      - name: Live start and port recovery
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name container-start -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-start-docker.test.ts --parallel=1

      - name: Live staged mount consumers
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name staged-input-relay -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/staged-input-relay-docker.test.ts --parallel=1

      - name: Live input stamps across a restart
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name input-stamps -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/portable-inputs-stamps-docker.test.ts --parallel=1

      - name: Live project Git mirror
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name git-mirror -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/project-git-mirror-docker.test.ts --parallel=1

      - name: Live bridge credential (H4)
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name bridge-credential -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/bridge-credential-docker.test.ts --parallel=1

      - name: Live Claude config allowlist and Claude start (M8)
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name claude-config-filter -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/claude-config-filter-docker.test.ts --parallel=1

      - name: Live replacement (C14-C19)
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-replacement.test.ts --parallel=1

      - name: Live volume metadata and OpenCode active account data contracts
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name container-data-contracts -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-data-contracts.test.ts --parallel=1

      - name: Live network (C22, C24, C26)
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-network.test.ts --parallel=1

      - name: Live firewall (C23)
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-firewall.test.ts --parallel=1

      - name: Live firewall without workflow seed
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_LIVE_GITHUB_RANGES_SEED: ""
        run: mise run test:logged -- --name firewall-without-seed -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-firewall.test.ts --parallel=1 --test-name-pattern 'restricted boot fetches GitHub ranges without a workflow seed'

      # IPv6 on an attached network and DNS rotation. The daemon-restart case
      # needs a disposable daemon and stays a manual run (0018 task 3).
      - name: Live egress conditions (IPv6, DNS rotation)
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_LIVE_IPV6_NETWORK: "1"
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-egress-conditions.test.ts --parallel=1

      # TLS SNI, HTTP Host and DNS name checks at the egress gateway (M12).
      - name: Live egress name checks (M12)
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-egress-filter.test.ts --parallel=1

      # Claude Code, Codex, OpenCode, Pi and Grok finish fake-provider turns with the
      # telemetry hosts refused (6100); Cursor remains unqualified (7420).
      - name: Live agent CLIs without telemetry hosts
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-telemetry-hosts.test.ts --parallel=1

      # Host loopback refused on a default rootless daemon (to-do 4730 task 2).
      # It skips on these rootful runners: it needs a rootless daemon declared
      # with ORKESTRATOR_LIVE_ROOTLESS_HOST_LOOPBACK=disabled, which
      # `mise run docker:disposable -- start` prints for a manual run.
      - name: Live rootless default loopback
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-rootless-loopback.test.ts --parallel=1

      # Requires a rootless daemon started with host loopback enabled and
      # ORKESTRATOR_LIVE_ROOTLESS_HOST_LOOPBACK=enabled. It skips on these
      # rootful runners; use a disposable --host-loopback daemon for a live run.
      - name: Live rootless enabled host loopback
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name rootless-host-loopback -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-rootless-host-loopback.test.ts --parallel=1

      # Requires execution on the rootful daemon's host and an explicit
      # ORKESTRATOR_LIVE_HOST_FIREWALL=none declaration. Hosted runners do not
      # guarantee that prerequisite, so leave it unset and skip this case.
      - name: Live rootful host reach without a host firewall
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name rootful-host-reach -- bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-rootful-host-reach.test.ts --parallel=1

      - name: Live readiness faults (C09, C10, C22, C23)
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-readiness.test.ts --parallel=1

      - name: Live rebuild faults (C15)
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-rebuild-faults.test.ts --parallel=1

      # The build pipeline's "Rewind code to here" through `docker exec`,
      # on fake providers (to-do 0405, task 7).
      - name: Live build pipeline code rewind
        if: ${{ !cancelled() }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/build-pipeline-code-rewind-docker.test.ts --parallel=1

      # The container-side change signals: the image's own hook and watcher
      # commands ring the production routes through Linux Engine's
      # host-gateway alias.
      - name: Live Claude state signal (B18)
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_TEST_STATE_SIGNAL_IMAGE: ${{ env.ORKESTRATOR_QUALIFICATION_IMAGE }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/claude-state-signal-docker.test.ts --parallel=1

      # The image's real Claude CLI against a fake API on the container's
      # loopback: StopFailure stops a refused turn reading working (to-do 1200).
      - name: Live Claude terminal failed turn
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_TEST_STATE_SIGNAL_IMAGE: ${{ env.ORKESTRATOR_QUALIFICATION_IMAGE }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/claude-terminal-failed-turn-docker.test.ts --parallel=1

      # The claude-tmux hook doorbell: the image's install probe and hook ring
      # to a fake doorbell on the container's loopback, and a real tab loop's
      # idle exec count (to-do 1202, task 8).
      - name: Live tmux hook doorbell
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_TEST_STATE_SIGNAL_IMAGE: ${{ env.ORKESTRATOR_QUALIFICATION_IMAGE }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/tmux-hook-signal-docker.test.ts --parallel=1

      - name: Live container worktree signal
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_TEST_STATE_SIGNAL_IMAGE: ${{ env.ORKESTRATOR_QUALIFICATION_IMAGE }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-worktree-signal-docker.test.ts --parallel=1

      # Design export through real `docker exec` into the run's image: client
      # kills, the daemon closing the helper's stdin, and digest reconciliation
      # (todo 0036 task 2).
      - name: Live design export
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_TEST_DOCKER_DESIGN_IMAGE: ${{ env.ORKESTRATOR_QUALIFICATION_IMAGE }}
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./src/core/design/export-container.test.ts --parallel=1

      # Numbers only, compared by hand with the Docker Desktop figures
      # (container-qualification.md, "Exec cost and container change signals").
      - name: Exec cost (B18, status scan, tree walk, watcher)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p output/benchmarks
          bun apps/backend/scripts/container-exec-cost.ts --image "$ORKESTRATOR_QUALIFICATION_IMAGE" --execs 200 --repo . --watcher --out output/benchmarks/exec-cost-${{ matrix.name }}.json

      # Numbers only: the regression targets are compared by hand
      # (container-qualification.md, "Benchmarks"). Runtimes get the
      # built-in default budget, as on a new install.
      - name: Benchmarks (C28)
        if: ${{ !cancelled() }}
        env:
          RUN_CONTAINER_BENCHMARKS: "1"
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-benchmarks.test.ts --parallel=1

      - name: Upload the benchmark report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-benchmarks-${{ matrix.name }}
          path: |
            output/benchmarks/b*.json
            output/benchmarks/exec-cost-*.json
          if-no-files-found: ignore
          retention-days: 30

      # Last, so nothing else runs on a daemon that was just restarted: a real
      # daemon restart (the runner's own `systemctl restart docker`, live-restore
      # off) while a launch waits for readiness and while a rebuild's copy
      # helper is writing (to-do 0019 task 5, retired; see
      # docs/development/container-qualification.md). One step per scenario,
      # like every suite above, so a launch failure still reports the copy
      # result. 1 GiB keeps the copy scenario within the runner's disk.
      - name: Live Docker daemon restart during launch (C09)
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_LIVE_DAEMON_RESTART_COMMAND: sudo systemctl restart docker
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-readiness.test.ts --parallel=1 --test-name-pattern 'Docker daemon restart'

      - name: Live Docker daemon restart during rebuild copy (C15)
        if: ${{ !cancelled() }}
        env:
          ORKESTRATOR_LIVE_DAEMON_RESTART_COMMAND: sudo systemctl restart docker
          ORKESTRATOR_LIVE_RESTART_COPY_MIB: "1024"
        run: bun test --cwd apps/backend --preload ../../tests/setup-node.ts ./tests/container-live-rebuild-faults.test.ts --parallel=1 --test-name-pattern 'Docker daemon restart'
