[install]
# The build relies on every dependency resolving from inside this checkout:
# TypeScript finds peer type packages (e.g. @types/react for @dnd-kit) by
# walking up to the workspace node_modules, and bridge vendoring copies the
# isolated store. A user-level `globalStore = true` moves store entries under
# ~/.bun/install/cache/links, outside that walk, so pin it off here.
globalStore = false

[test]
preload = ["./tests/register-dom.ts", "./tests/setup.ts"]
pathIgnorePatterns = [
  "apps/backend/src/**",
  "apps/backend/tests/**",
  "apps/**/dist/**",
  "apps/web/src/**",
  "bridges/**/dist/**",
  "release/**",
]

# `bun fmt` options, on top of Prettier's defaults. Do not add an
# .oxfmtrc.json or .prettierrc: either takes precedence over this section.
# See docs/development/linting.md.
[fmt]
printWidth = 100
ignorePatterns = ["bridges/codex-bridge/src/app-server/generated/**", "docs/**", "**/*.md"]
