name: Lint and format

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxc:
    name: oxfmt and oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate mise tasks
        run: mise tasks validate

      # Both steps run even when the first fails, so one push reports every
      # violation instead of hiding lint behind a formatting diff.
      - name: Check formatting
        id: format
        run: mise run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: mise run lint
