name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push supersedes a pull request's run, but every main commit keeps
# its own result so a regression can be traced to the commit that caused it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oxc:
    name: bun fmt and oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate mise tasks
        run: mise tasks validate

      # Both steps run even when the first fails, so one push reports every
      # violation instead of hiding lint behind a formatting diff.
      - name: Check formatting
        id: format
        run: mise run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: mise run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: mise run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download pinned parser binaries
        run: |
          mise run download:claude
          mise run download:codex
          echo "$GITHUB_WORKSPACE/binaries" >> "$GITHUB_PATH"

      # The Claude execution-policy qualification runs the pinned CLI's real
      # Linux sandbox, which needs bubblewrap and socat. Ubuntu 24.04's AppArmor
      # policy also denies the unprivileged user namespaces bubblewrap creates.
      - name: Install Claude sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap socat
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / true

      - name: Run complete non-iOS suite
        env:
          # A known place for the failing groups' full logs, uploaded below.
          ORKESTRATOR_TEST_LOG_DIR: ${{ runner.temp }}/orkestrator-test-logs
        run: mise run test:full

      # The console keeps only each failing group's tail and its failure
      # reports; the compressed full logs hold everything else.
      - name: Upload failing test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orkestrator-test-logs
          if-no-files-found: ignore
          retention-days: 7
