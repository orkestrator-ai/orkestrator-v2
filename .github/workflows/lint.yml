name: Lint and format

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxc:
    name: oxfmt and oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate mise tasks
        run: mise tasks validate

      # Both steps run even when the first fails, so one push reports every
      # violation instead of hiding lint behind a formatting diff.
      - name: Check formatting
        id: format
        run: mise run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: mise run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: mise run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download pinned parser binaries
        run: |
          mise run download:claude
          mise run download:codex
          echo "$GITHUB_WORKSPACE/binaries" >> "$GITHUB_PATH"

      - name: Run default non-iOS suite
        run: mise run test
