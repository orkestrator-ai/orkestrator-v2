[tools]
bun = "1.4.4"

[tasks.dev]
description = "Start the Electron development application"
run = "bunx turbo --cwd . run dev --filter=@orkestrator/desktop"

[tasks."dev:test"]
description = "Start an isolated development test profile (foreground supervisor; stays attached)"
raw_args = true
run = "bun apps/desktop/scripts/dev-test.ts"

[tasks."dev:status"]
description = "Inspect an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-status.ts"

[tasks."dev:login"]
description = "Authenticate an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-login.ts"

[tasks."dev:stop"]
description = "Stop an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-stop.ts"

[tasks."dev:reset"]
description = "Reset an isolated development test profile"
raw_args = true
run = "bun apps/desktop/scripts/dev-reset.ts"

[tasks."dev:prune"]
description = "Remove stopped development profiles whose checkout is gone (--older-than <days> for idle ones)"
raw_args = true
run = "bun apps/desktop/scripts/dev-prune.ts"

[tasks."dev:web"]
description = "Start the Vite frontend and standalone backend"
run = "bunx turbo run dev:web --cwd . --filter=@orkestrator/web --filter=@orkestrator/backend"

[tasks."dev:web-public"]
description = "Start the public web client"
run = "bunx turbo --cwd . run dev --filter=@orkestrator/web-public"

[tasks."dev:renderer"]
description = "Start only the Electron renderer"
run = "bunx turbo --cwd . run dev --filter=@orkestrator/web"

[tasks."dev:ios"]
description = "Build and launch the iOS simulator application"
raw_args = true
run = "bun scripts/run-ios-simulator.ts"

[tasks."start:web"]
description = "Build and start the standalone backend"
run = "bunx turbo run start:web --cwd . --filter=@orkestrator/backend"

[tasks."start:web-public"]
description = "Build and start the public-web backend"
run = "bunx turbo run start:web-public --cwd . --filter=@orkestrator/backend"

[tasks.build]
description = "Build the desktop application"
run = "bunx turbo --cwd . run build --filter=@orkestrator/desktop"

[tasks."build:desktop"]
description = "Build the desktop application"
run = "bunx turbo --cwd . run build --filter=@orkestrator/desktop"

[tasks."build:backend"]
description = "Build the standalone backend"
run = "bunx turbo --cwd . run build --filter=@orkestrator/backend"

[tasks."build:cli"]
description = "Build the published CLI"
run = "bunx turbo --cwd . run build --filter=orkestrator"

[tasks."build:renderer"]
description = "Build the Electron renderer"
run = "bunx turbo --cwd . run build --filter=@orkestrator/web"

[tasks."build:web-public"]
description = "Build the public web client"
run = "bunx turbo --cwd . run build --filter=@orkestrator/web-public"

[tasks."build:electron"]
description = "Build the Electron application"
run = "bunx turbo --cwd . run build --filter=@orkestrator/desktop"

[tasks."build:claude-bridge"]
description = "Build the Claude bridge"
run = "bunx turbo --cwd . run build --filter=claude-bridge"

[tasks."build:codex-bridge"]
description = "Build the Codex bridge"
run = "bunx turbo --cwd . run build --filter=codex-bridge"

[tasks."build:acp-bridge"]
description = "Build the ACP bridge"
run = "bunx turbo --cwd . run build --filter=acp-bridge"

[tasks."build:pi-bridge"]
description = "Build the Pi bridge"
run = "bunx turbo --cwd . run build --filter=pi-bridge"

[tasks."build:cursor-bridge"]
description = "Build the Cursor bridge"
run = "bunx turbo --cwd . run build --filter=cursor-bridge"

[tasks."build:all"]
description = "Build every workspace package"
run = "bunx turbo --cwd . run build"

[tasks."download:bun"]
description = "Download the pinned Bun runtime for desktop packaging"
run = "./scripts/download-bun.sh"

[tasks."download:agent"]
description = "Download an agent CLI artifact"
raw_args = true
run = "bun scripts/download-agent.ts"

[tasks."download:claude"]
description = "Download the pinned Claude CLI"
run = "bun scripts/download-agent.ts claude"

[tasks."download:opencode"]
description = "Download the pinned OpenCode CLI"
run = "bun scripts/download-agent.ts opencode"

[tasks."download:codex"]
description = "Download the pinned Codex CLI"
run = "bun scripts/download-agent.ts codex"

[tasks."download:grok"]
description = "Download the pinned Grok CLI"
run = "bun scripts/download-agent.ts grok"

[tasks."download:pi"]
description = "Download the pinned Pi CLI"
run = "bun scripts/download-agent.ts pi"

[tasks."toolchain:install"]
description = "Download and verify every pinned agent binary this data directory needs (same as `orkestrator toolchain install`)"
raw_args = true
run = "bun scripts/toolchain-install.ts"

[tasks."download:binaries"]
description = "Download the desktop-bundled runtime and agent binaries"
run = [
  "mise run download:bun",
  "mise run download:claude",
  "mise run download:opencode",
  "mise run download:codex",
]

[tasks."codex:protocol"]
description = "Regenerate the Codex app-server protocol"
run = "bun scripts/generate-codex-app-server-protocol.ts"

[tasks."codex:protocol:check"]
description = "Check the Codex app-server protocol for drift"
run = "bun scripts/generate-codex-app-server-protocol.ts --check"

[tasks.setup]
description = "Install dependencies and build every native bridge"
run = [
  "bun install",
  "mise run build:claude-bridge",
  "mise run build:codex-bridge",
  "mise run build:acp-bridge",
  "mise run build:pi-bridge",
  "mise run build:cursor-bridge",
]

[tasks."pack:cli"]
description = "Pack the CLI workspace"
run = "bun pm pack --cwd packages/cli"

[tasks."smoke:cli"]
description = "Smoke-test the packed CLI"
run = "bun run --cwd packages/cli smoke:pack"

[tasks."publish:cli"]
description = "Smoke-test and publish the CLI under its update channel's npm dist-tag"
run = ["mise run smoke:cli", "bun scripts/publish-cli.ts"]

[tasks.preview]
description = "Preview the production renderer"
run = "bun run --cwd apps/web preview"

[tasks.test]
description = "Run the non-iOS test suite, including the area suites this change can reach"
run = "bun scripts/test-all.ts"

[tasks."test:full"]
description = "Run the complete non-iOS test suite, including every area suite"
env = { ORKESTRATOR_TEST_AREAS = "all" }
run = "bun scripts/test-all.ts"

[tasks."test:changed"]
description = "Run tests affected by changes from main"
env = { ORKESTRATOR_TEST_AFFECTED = "1" }
run = "bun scripts/test-all.ts"

[tasks."test:all"]
description = "Run the complete test suite, including iOS"
env = { ORKESTRATOR_INCLUDE_IOS = "1", ORKESTRATOR_TEST_AREAS = "all" }
run = "bun scripts/test-all.ts"

[tasks."test:logged"]
description = "Run a command with bounded persistent logs"
raw_args = true
run = "bun scripts/run-logged.ts"

[tasks."test:browser"]
description = "Run the component and public-site browser suites"
run = "bun check -p e2e/tsconfig.json && bunx playwright test --config e2e/playwright.config.ts && bunx playwright test --config e2e/public-site/playwright.config.ts"

[tasks."test:agent:browser"]
description = "Run browser agent tests against an already-running profile (use test:agent:browser:isolated for one-shot validation)"
depends = ["build:cli"]
run = "bunx playwright test --config e2e/agent-testing/playwright.browser.config.ts"

[tasks."test:agent:browser:isolated"]
description = "Start a disposable profile, run all browser agent tests, then stop/reset it"
raw_args = true
depends = ["build:cli"]
run = "bun apps/desktop/scripts/test-agent-browser-isolated.ts"

[tasks."test:agent:design:isolated"]
description = "One-shot real-stack design-canvas validation with disposable profile cleanup"
raw_args = true
run = "bun apps/desktop/scripts/test-agent-browser-isolated.ts --design"

[tasks."test:cli:scenarios"]
description = "Run targeted CLI scenarios against isolated packaged backends (credential-free unless --provider)"
raw_args = true
depends = ["build:cli"]
run = "bun packages/cli/scripts/run-scenarios.ts"

[tasks."test:agent:docker"]
description = "Run the Docker agent browser fixture"
env = { ORKESTRATOR_AGENT_TEST_DOCKER = "1" }
run = "bunx playwright test --config e2e/agent-testing/playwright.browser.config.ts --grep 'Docker fixture'"

[tasks."test:preview:docker"]
description = "Opt-in service preview checks on real Docker: same-port containers, host decoy, recreation, docker exec relay (needs ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE)"
run = """
: "${ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE:?Set ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE to the image under test}"
export ORKESTRATOR_TEST_DOCKER_RELAY_IMAGE="${ORKESTRATOR_TEST_DOCKER_RELAY_IMAGE:-$ORKESTRATOR_TEST_DOCKER_PREVIEW_IMAGE}"
bun test --cwd apps/backend ./src/core/preview-docker.test.ts ./src/preview-relay-supervisor.test.ts --parallel=1
"""

[tasks."test:preview:browser"]
description = "Opt-in Chromium, Firefox and WebKit private-origin checks (set ORKESTRATOR_TEST_PREVIEW_VITE_DIR for HMR)"
raw_args = true
run = "bunx playwright test --config e2e/preview/playwright.preview.config.ts"

[tasks."test:preview:bench"]
description = "Opt-in loopback latency of the preview routes, and a loopback self-test of the two-machine baseline tool"
# The bounded test console drops console.log unless asked; the numbers are the output.
env = { ORKESTRATOR_PREVIEW_BENCH = "1", ORKESTRATOR_TEST_VERBOSE_CONSOLE = "1" }
run = "bun test --cwd apps/backend ./src/preview-bench.test.ts ./src/preview-latency-baseline.test.ts --parallel=1"

[tasks."test:agent:paused-interactions"]
description = "Opt-in billed provider qualification past ten minutes against an already-running disposable profile"
run = "bunx playwright test --config e2e/agent-testing/playwright.paused-interactions.config.ts"

[tasks."test:agent:coordinator"]
description = "Opt-in live coordinator suite: a disposable profile and real provider turn per platform (--credential-source <platform> narrows)"
raw_args = true
run = "bun apps/desktop/scripts/test-agent-coordinator-live.ts"

[tasks."test:agent:electron"]
description = "Run agent tests in Electron"
run = "bunx playwright test --config e2e/agent-testing/playwright.electron.config.ts"

[tasks."test:ios"]
description = "Run the iOS unit tests"
run = "bun scripts/test-ios.ts"

[tasks."test:unit"]
description = "Run the root unit tests"
run = "bun test tests/unit"

[tasks."efficiency:baseline"]
description = "Run the efficiency counters harness (docs/development/efficiency-harness.md)"
raw_args = true
run = "bun scripts/efficiency/run.ts"

[tasks.typecheck]
description = "Typecheck every workspace package, the root and e2e tests, and repository scripts"
run = [
  "bunx turbo --cwd . run typecheck",
  "bun check -p tests/tsconfig.json",
  "bun check -p e2e/tsconfig.json",
  "bun check -p e2e/agent-testing/tsconfig.json",
]

[tasks."disk:report"]
description = "Report disk used by Orkestrator work, what is orphaned, and who cleans it (read-only)"
raw_args = true
run = "bun scripts/disk-report.ts"

[tasks.format]
description = "Format the repository"
run = "bun fmt ."

[tasks."format:check"]
description = "Check repository formatting"
run = "bun fmt --check ."

[tasks.lint]
description = "Lint the repository"
run = "bunx oxlint ."

[tasks."lint:fix"]
description = "Fix auto-fixable lint findings"
run = "bunx oxlint --fix ."

[tasks.check]
description = "Check formatting, lint, and types"
run = ["mise run format:check", "mise run lint", "mise run typecheck"]

[tasks."verify:opencode:live"]
description = "Run live OpenCode compatibility checks"
env = { RUN_LIVE_OPENCODE_COMPATIBILITY = "1" }
run = [
  "bun test --cwd apps/backend src/core/opencode-live-compatibility.live.test.ts",
  "bun test --cwd apps/backend src/core/opencode-review-permissions.live.test.ts",
]

[tasks."verify:claude:mcp-live"]
description = "Prove Claude MCP removal and rename on a running CLI (real CLI, no credentials)"
run = "bun test --cwd bridges/claude-bridge ./src/services/session-manager-prompt-mcp-sync.live.test.ts --preload ../../tests/setup-node.ts --parallel=1"

[tasks."verify:opencode:mcp-live"]
description = "Prove OpenCode's in-place MCP reload on the pinned binary (real binary, no credentials)"
env = { RUN_LIVE_OPENCODE_MCP = "1" }
run = "bun test --cwd apps/backend ./tests/opencode-mcp-reload-live.test.ts --parallel=1"

[tasks."verify:toolchains:live"]
description = "Verify live toolchain artifacts"
env = { RUN_LIVE_TOOLCHAIN_ARTIFACTS = "1" }
run = "bun scripts/verify-toolchain-artifacts.ts"

[tasks."verify:packaged-backend"]
description = "Verify the packaged backend runtime"
run = "bun scripts/verify-packaged-backend.ts"

[tasks."verify:codex:protocol"]
description = "Strictly verify the Codex app-server protocol"
env = { CODEX_PROTOCOL_CHECK_ALLOW_MISSING_BINARY = "0" }
run = "bun scripts/generate-codex-app-server-protocol.ts --check"

[tasks."docker:check-base"]
description = "Check whether the pinned Docker base image digest is still current"
run = "bun scripts/check-base-image-digest.ts"

[tasks."docker:build"]
description = "Build the production Docker image"
run = "docker build $(bun scripts/docker-image-build-args.ts) -t orkestrator-v2:latest -f docker/Dockerfile ."

[tasks."docker:build:dev"]
description = "Build the development Docker image"
raw_args = true
run = "bun apps/desktop/scripts/dev-build-image.ts"

[tasks."package:mac"]
description = "Build and install an unpacked macOS application"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all",
  "bunx electron-builder --mac --dir",
  "bun scripts/install-packaged-app-mac.ts",
]

[tasks."package:linux"]
description = "Build and install an unpacked Linux application"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all",
  "bunx electron-builder --linux --dir",
  "bun scripts/install-packaged-app-linux.ts",
]

[tasks."package:release"]
description = "Build, sign, notarize, and install a macOS release"
run = [
  "bun install --frozen-lockfile",
  "mise run download:bun",
  "mise run build:all",
  "bunx electron-builder --mac --config electron-builder.release.config.ts --publish never",
  "bun scripts/install-packaged-app-mac.ts",
]

[tasks."release:version"]
description = "Set the Orkestrator version in every manifest and regenerate the lockfiles"
raw_args = true
run = "bun scripts/set-version.ts"

[tasks."release:desktop"]
description = "Build this platform's desktop release and upload it to the draft GitHub release"
raw_args = true
run = "bun scripts/release-desktop.ts build"

[tasks."release:publish"]
description = "Publish the draft GitHub release once macOS and Linux are both uploaded"
run = "bun scripts/release-desktop.ts publish"

