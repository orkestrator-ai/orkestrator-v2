name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push supersedes a pull request's run, but every main commit keeps
# its own result so a regression can be traced to the commit that caused it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-context:
    name: Stage preview worker context (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.context.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stage and digest the worker context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(mise current bun)"
          bun docker/artifact-preview-worker/stage-context.ts "${RUNNER_TEMP}/worker-context"
          digest="$(bun docker/artifact-preview-worker/context-digest.ts "${RUNNER_TEMP}/worker-context")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  worker-context-parity:
    name: Preview worker staging parity (${{ matrix.runner }})
    needs: worker-context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compare independently staged context with Linux x64
        shell: bash
        env:
          CONTEXT_DIGEST: ${{ needs.worker-context.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(mise current bun)"
          bun docker/artifact-preview-worker/stage-context.ts "${RUNNER_TEMP}/worker-context"
          test "$(bun docker/artifact-preview-worker/context-digest.ts "${RUNNER_TEMP}/worker-context")" = "$CONTEXT_DIGEST"

  mobile-shell-browser:
    name: Mobile shell (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Test mobile shell input
        env:
          ORKESTRATOR_E2E_BROWSER: ${{ matrix.browser }}
        run: mise run test:logged -- --name mobile-shell-${{ matrix.browser }} -- bunx playwright test --config e2e/playwright.config.ts e2e/MobileAppShellLayout.spec.ts --workers=1

      - name: Test overview scroll preservation
        env:
          ORKESTRATOR_E2E_BROWSER: ${{ matrix.browser }}
        run: mise run test:logged -- --name overview-scroll-${{ matrix.browser }} -- bunx playwright test --config e2e/playwright.config.ts e2e/PipelineFlow.spec.ts e2e/GraphRunFlow.spec.ts --grep 'overview.*scroll position' --workers=1

      - name: Test inspector transcript preservation and settling
        env:
          ORKESTRATOR_E2E_BROWSER: ${{ matrix.browser }}
        run: mise run test:logged -- --name inspector-transcript-${{ matrix.browser }} -- bunx playwright test --config e2e/playwright.config.ts e2e/InspectorTranscriptHide.spec.ts --workers=1

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-shell-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

  oxc:
    name: bun fmt and oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate mise tasks
        run: mise tasks validate

      # Both steps run even when the first fails, so one push reports every
      # violation instead of hiding lint behind a formatting diff.
      - name: Check formatting
        id: format
        run: mise run format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: mise run lint

      # Repository-wide guards that need no build, so a PR hears within minutes
      # rather than after the test shards.
      - name: Scan DOM absence assertions
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name dom-absence-scan -- bun test tests/unit/dom-absence-scan.test.ts --test-name-pattern "never passes a DOM-producing query result" --parallel=1 --only-failures

      - name: Check the flaky-test index
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name flaky-test-index -- bun test tests/unit/flaky-tests-index.test.ts --parallel=1 --only-failures

      - name: Check to-do and flake numbers
        if: ${{ !cancelled() }}
        run: mise run test:logged -- --name doc-numbers -- bun test tests/unit/todo-index.test.ts tests/unit/number-claims.test.ts --parallel=1 --only-failures

      # Every registered command has a contract domain, the committed
      # manifest matches the registry (plan item 1006), and the untyped
      # command count did not rise (plan item 1011).
      - name: Check the command contract manifest
        if: ${{ !cancelled() }}
        run: mise run contract:check

      # The committed client adapter list matches the domain client
      # definitions (plan item 1009); the contract CI job (1008) reads it.
      - name: Check the domain client adapter list
        if: ${{ !cancelled() }}
        run: mise run contract:adapters:check

      # The support window (plan item 1008): an adapter for every (domain,
      # version) an in-window release speaks, no command removed without a
      # domain bump and a register row, register rows that name real
      # counters and adapters, and stored argument schemas.
      - name: Check the contract against the support window
        if: ${{ !cancelled() }}
        run: mise run contract:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: mise run typecheck

  claude-hook-only-windows:
    name: Claude hook-only qualification (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Qualify real Claude hook-only execution
        run: mise run test:logged -- --name claude-hook-only-windows -- bun test --cwd bridges/claude-bridge --preload ../../tests/setup-node.ts ./src/conformance-coordinator-sandbox-live.test.ts --parallel=1 --test-name-pattern 'read-only turn without|hook-only adversarial'

  # The suite runs as shards, one runner each. On a single four-core runner the
  # workspace group (backend then web, one Turbo slot) took over 30 minutes
  # and the concurrent groups slowed tests past their per-test timeouts.
  # `ORKESTRATOR_TEST_GROUPS` picks each shard's groups; together the shards
  # cover every group (tests/unit/ci-workflows.test.ts).
  test-shard:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: backend
            groups: backend
          - shard: workspace
            groups: workspace
          # The paired Claude qualification runs on exactly one host.
          - shard: root-bridges
            groups: root,bridges,codex-protocol
            qualify-claude: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Verify active Bun matches mise
        run: test "$(bun --version)" = "$(mise current bun)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download pinned parser binaries
        run: |
          mise run download:claude
          mise run download:codex
          echo "$GITHUB_WORKSPACE/binaries" >> "$GITHUB_PATH"

      - name: Qualify Claude hook-only turns in a real Linux container
        if: ${{ matrix.qualify-claude }}
        run: |
          docker run --rm --user root \
            --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo \
            --env ORKESTRATOR_POLICY_CLAUDE_PATH=/repo/binaries/claude \
            oven/bun:1.4.4 sh -c '
              apt-get update -qq && apt-get install -y --no-install-recommends git curl &&
              bun scripts/run-logged.ts --name claude-hook-only-container -- \
                bun test --cwd bridges/claude-bridge --preload ../../tests/setup-node.ts \
                ./src/conformance-coordinator-sandbox-live.test.ts --parallel=1 \
                --test-name-pattern "read-only turn without|hook-only adversarial"
            '

      # Preserve paired probe/CLI evidence on this same disposable AppArmor host.
      # The restricted phase must run before any sysctl/profile remediation.
      - name: Install Claude sandbox and completion shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap socat zsh fish

      - name: Qualify Claude under stock AppArmor policy
        if: ${{ matrix.qualify-claude }}
        env:
          ORKESTRATOR_CLAUDE_APPARMOR_PHASE: restricted
          ORKESTRATOR_POLICY_CLAUDE_PATH: ${{ github.workspace }}/binaries/claude
          ORKESTRATOR_CLAUDE_APPARMOR_EVIDENCE: ${{ runner.temp }}/claude-apparmor
        run: mise run test:logged -- --name claude-apparmor-restricted -- bun test --cwd bridges/claude-bridge --preload ../../tests/setup-node.ts ./src/conformance-apparmor-live.test.ts --parallel=1

      # The Claude execution-policy qualification runs the pinned CLI's real
      # Linux sandbox, which needs bubblewrap and socat. Ubuntu's AppArmor
      # policy denies the unprivileged user namespaces bubblewrap creates, and
      # its bwrap profiles strip capabilities from a namespace nested inside
      # one, which the CLI's seccomp helper creates ("nested userns is
      # capability-restricted"). Both checks below fail here, not in the tests.
      # The CLI's shell-completion tests run the generated scripts in zsh and
      # fish, which the runner image does not ship.
      - name: Allow nested namespaces on the disposable runner
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_unconfined=0
          for profile in bwrap-userns-restrict unprivileged_userns; do
            if [ -f "/etc/apparmor.d/$profile" ]; then
              sudo apparmor_parser --remove "/etc/apparmor.d/$profile"
            fi
          done
          bwrap --unshare-all --ro-bind / / true
          bwrap --unshare-user --ro-bind / / --dev /dev --proc /proc -- \
            unshare --user --map-root-user true

      - name: Qualify Claude after AppArmor remediation
        if: ${{ matrix.qualify-claude }}
        env:
          ORKESTRATOR_CLAUDE_APPARMOR_PHASE: remediated
          ORKESTRATOR_POLICY_CLAUDE_PATH: ${{ github.workspace }}/binaries/claude
          ORKESTRATOR_CLAUDE_APPARMOR_EVIDENCE: ${{ runner.temp }}/claude-apparmor
        run: mise run test:logged -- --name claude-apparmor-remediated -- bun test --cwd bridges/claude-bridge --preload ../../tests/setup-node.ts ./src/conformance-apparmor-live.test.ts --parallel=1

      - name: Upload paired Claude AppArmor evidence
        if: ${{ matrix.qualify-claude && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-apparmor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-apparmor
          if-no-files-found: error
          retention-days: 30

      - name: Run this shard of the complete non-iOS suite
        env:
          # A known place for the failing groups' full logs, uploaded below.
          ORKESTRATOR_TEST_LOG_DIR: ${{ runner.temp }}/orkestrator-test-logs
          ORKESTRATOR_TEST_GROUPS: ${{ matrix.groups }}
        run: mise run test:full

      # The console keeps only each failing group's tail and its failure
      # reports; the compressed full logs hold everything else.
      - name: Upload failing test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orkestrator-test-logs
          if-no-files-found: ignore
          retention-days: 7

  # The one status for the whole suite, and the context the planned required
  # check names (docs/todo/cross-cutting/0030-test-suite-and-ci-health.md).
  test:
    name: Unit and integration tests
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every test shard to pass
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: test "$SHARDS" = success
